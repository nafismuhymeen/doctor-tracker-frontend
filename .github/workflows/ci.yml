name: CI

on:
  push:
    branches: [main, master, appointment]
  pull_request:
    branches: [main, master, appointment]

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Run unit tests
        run: yarn test

      - name: Build Next.js application (standalone)
        env:
          NEXT_PUBLIC_API_URL: /api/v1
        run: yarn build

  e2e:
    name: Playwright End-to-End & Axe Accessibility
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: nafismuhymeen/doctor-tracker-backend
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start MongoDB Replica Set via Docker Compose
        run: |
          cd backend
          docker compose up -d mongo
          # Wait for MongoDB replica set healthcheck
          until [ $(docker inspect --format='{{json .State.Health.Status}}' doctor_tracker_mongo) == '"healthy"' ]; do
            echo "Waiting for MongoDB replica set to initialize..."
            sleep 2
          done

      - name: Install backend dependencies and seed demo data
        run: |
          cd backend
          yarn install --frozen-lockfile --ignore-engines
          MONGODB_URI="mongodb://localhost:27017/doctor_tracker?replicaSet=rs0" \
          JWT_ACCESS_SECRET="ci_test_access_secret_1234567890" \
          JWT_REFRESH_SECRET="ci_test_refresh_secret_1234567890" \
          yarn seed:demo

      - name: Start backend API server
        run: |
          cd backend
          MONGODB_URI="mongodb://localhost:27017/doctor_tracker?replicaSet=rs0" \
          JWT_ACCESS_SECRET="ci_test_access_secret_1234567890" \
          JWT_REFRESH_SECRET="ci_test_refresh_secret_1234567890" \
          PORT=5000 \
          CORS_ORIGIN="http://localhost:3000" \
          COOKIE_SAME_SITE="lax" \
          nohup yarn dev > backend.log 2>&1 &
          sleep 5

      - name: Install frontend dependencies and Playwright browsers
        run: |
          cd frontend
          yarn install --frozen-lockfile --ignore-engines
          npx playwright install --with-deps chromium

      - name: Build and start frontend application
        run: |
          cd frontend
          BACKEND_INTERNAL_URL="http://localhost:5000" \
          NEXT_PUBLIC_API_URL="http://localhost:5000/api/v1" \
          yarn build
          BACKEND_INTERNAL_URL="http://localhost:5000" \
          NEXT_PUBLIC_API_URL="http://localhost:5000/api/v1" \
          nohup yarn start -p 3000 > frontend.log 2>&1 &
          sleep 5

      - name: Run Playwright E2E and Axe scans
        run: |
          cd frontend
          PLAYWRIGHT_BASE_URL="http://localhost:3000" \
          yarn test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
